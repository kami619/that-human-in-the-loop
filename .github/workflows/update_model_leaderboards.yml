name: Update Model Leaderboards

on:
  schedule:
    - cron: '0 10 * * *'
  workflow_dispatch: # Allow manual trigger for testing

permissions:
  contents: write

jobs:
  update-leaderboard:
    runs-on: ubuntu-latest
    # ARTIFICIAL_ANALYSIS_API_KEY lives as a "prod" environment secret, not a
    # repo secret — without this the expansion is empty and the script exits 1.
    environment: prod

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run ETL unit tests
        run: |
          python -m unittest functions.test_update_model_leaderboards

      - name: Run leaderboard update
        env:
          ARTIFICIAL_ANALYSIS_API_KEY: ${{ secrets.ARTIFICIAL_ANALYSIS_API_KEY }}
        run: |
          python functions/update_model_leaderboards.py

      - name: Validate refreshed snapshots
        run: |
          python -m unittest functions.test_leaderboard_snapshots

      - name: Commit and push to main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

          git add deepswe-leaderboard.json artificial-analysis-leaderboard.json
          if git diff --staged --quiet; then
            echo "No leaderboard changes to commit."
            exit 0
          fi

          git commit -m "chore: update model leaderboard data"
          git push origin HEAD:main
