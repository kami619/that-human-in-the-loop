name: Update Model Leaderboards

on:
  schedule:
    - cron: '0 10 * * *'
  workflow_dispatch: # Allow manual trigger for testing

permissions:
  contents: write
  pull-requests: write

jobs:
  update-leaderboard:
    runs-on: ubuntu-latest
    # ARTIFICIAL_ANALYSIS_API_KEY lives as a "prod" environment secret, not a
    # repo secret — without this the expansion is empty and the script exits 1.
    environment: prod

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run tests
        run: |
          python -m unittest discover -s functions -p "test_*.py"

      - name: Run leaderboard update
        env:
          ARTIFICIAL_ANALYSIS_API_KEY: ${{ secrets.ARTIFICIAL_ANALYSIS_API_KEY }}
        run: |
          python functions/update_model_leaderboards.py

      - name: Check for changes
        id: git-check
        run: |
          git diff --exit-code deepswe-leaderboard.json artificial-analysis-leaderboard.json || echo "changes=true" >> $GITHUB_OUTPUT

      - name: Commit and push changes
        if: steps.git-check.outputs.changes == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

          BRANCH="leaderboard-update-$(date +%Y%m%d)"
          git checkout -b "$BRANCH"

          git add deepswe-leaderboard.json artificial-analysis-leaderboard.json
          git commit -m "chore: update model leaderboard data"

          git push -u origin "$BRANCH"

          # Only the "PR is already open for this branch" case is tolerable. A
          # blanket `|| echo ...` also swallows permission and network errors,
          # which is how a token missing pull-requests:write went unnoticed.
          if [ -n "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            echo "PR already open for $BRANCH"
          else
            gh pr create --title "chore: update model leaderboard data" \
              --body "Automated daily DeepSWE and Artificial Analysis leaderboard update." \
              --base main
          fi
